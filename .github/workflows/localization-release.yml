name: Build multilingual Mac preview

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: localization-mac-preview
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'qidlek114/t3code'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      VITEST_MAX_WORKERS: "2"
      CHECK_CHANGED_TEST_BATCH_SIZE: "24"
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out public source without submodule credential cleanup
        shell: bash
        env:
          CHECKOUT_REF: ${{ github.sha }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git fetch --no-tags origin "$CHECKOUT_REF"
          git sparse-checkout set --no-cone '/*' '!/.repos/' '!/apps/mobile/modules/t3-terminal/Vendor/**/*.a'
          git checkout --detach FETCH_HEAD
      - uses: ./.github/actions/setup-ci-deps
      - run: vp exec playwright install --with-deps chromium
        working-directory: apps/web
      - run: node apps/desktop/scripts/ensure-electron-runtime.mjs
      - run: |
          git fetch --no-tags https://github.com/pingdotgg/t3code.git main:refs/remotes/upstream/main
          vp run check:changed upstream/main --concurrency 2
          node .github/scripts/localization-build.cjs
      - id: version
        shell: bash
        run: |
          base=$(node -p "require('./apps/desktop/package.json').version.split('-')[0]")
          echo "version=$base-preview.$(date -u +%Y%m%d).$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      T3CODE_DESKTOP_UPDATE_REPOSITORY: qidlek114/t3code
      T3CODE_DESKTOP_SIGNED: "false"
      VERSION: ${{ needs.verify.outputs.version }}
      BUILD_ARCH: ${{ matrix.arch }}
    steps:
      - name: Check out public source without submodule credential cleanup
        shell: bash
        env:
          CHECKOUT_REF: ${{ github.sha }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git fetch --no-tags origin "$CHECKOUT_REF"
          git sparse-checkout set --no-cone '/*' '!/.repos/' '!/apps/mobile/modules/t3-terminal/Vendor/**/*.a'
          git checkout --detach FETCH_HEAD
      - uses: ./.github/actions/setup-ci-deps
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: stable
      - name: Prepare separate app identity and data directories
        run: node .github/scripts/localization-build.cjs --apply
      - name: Enable official T3 Connect with its public source-build configuration
        run: cp .env.example .env
      - name: Build unsigned DMG and ZIP
        run: vp run dist:desktop:artifact --platform mac --target dmg --arch "$BUILD_ARCH" --build-version "$VERSION" --verbose
      - name: Launch packaged app with the synthetic fixture
        shell: bash
        run: |
          set -euo pipefail
          mount="$RUNNER_TEMP/i18n-launch"
          dmg=$(find release -maxdepth 1 -name '*.dmg' -print -quit)
          hdiutil attach -nobrowse -readonly -mountpoint "$mount" "$dmg"
          trap 'hdiutil detach "$mount" -force >/dev/null || true' EXIT
          app=$(find "$mount" -maxdepth 1 -name '*.app' -print -quit)
          executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")
          node scripts/smoke-desktop-app.ts --executable "$app/Contents/MacOS/$executable" --artifacts-dir "$RUNNER_TEMP/i18n-smoke"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mac-${{ matrix.arch }}
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error
          retention-days: 7

  draft:
    needs: [verify, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.verify.outputs.version }}
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: mac-*
          merge-multiple: true
          path: release
      - name: Create draft preview after both architectures pass
        shell: bash
        run: |
          set -euo pipefail
          sha256sum release/* > release/SHA256SUMS.txt
          printf 'English / 简体中文 / 繁體中文 preview.\n\nSource: %s\n\nUnsigned test build, separate app identity and data directories. No automatic update feed. Review before publishing; macOS Gatekeeper may block unsigned downloads. Official deep-link and cloud passkey integration require separate release validation.\n' "$SOURCE_SHA" > release/NOTES.md
          gh release create "v$VERSION" release/*.dmg release/*.zip release/SHA256SUMS.txt --target "$SOURCE_SHA" --draft --prerelease --title "T3 Code I18n $VERSION" --notes-file release/NOTES.md
