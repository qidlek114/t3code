name: Localization checks

on:
  push:
    branches: [localization]
  pull_request:
    branches: [localization]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    if: github.repository == 'qidlek114/t3code'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      VITEST_MAX_WORKERS: "2"
      CHECK_CHANGED_TEST_BATCH_SIZE: "24"
    steps:
      - name: Check out public source without submodule credential cleanup
        shell: bash
        env:
          CHECKOUT_REF: ${{ github.sha }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          set -euo pipefail
          git init .
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git fetch --no-tags origin "$CHECKOUT_REF"
          git sparse-checkout set --no-cone '/*' '!/.repos/' '!/apps/mobile/modules/t3-terminal/Vendor/**/*.a'
          git checkout --detach FETCH_HEAD
      - uses: ./.github/actions/setup-ci-deps
      - run: vp exec playwright install --with-deps chromium
        working-directory: apps/web
      - run: node apps/desktop/scripts/ensure-electron-runtime.mjs
      - name: Check the complete localization delta
        run: |
          git fetch --no-tags https://github.com/pingdotgg/t3code.git main:refs/remotes/upstream/main
          vp run check:changed upstream/main --concurrency 2
      - name: Check build isolation against upstream drift
        run: node .github/scripts/localization-build.cjs
